# ==========================================================================
# Decap CMS — administration de la rubrique Actualités
# Documentation : docs/CMS.md
# ==========================================================================

backend:
  name: github
  repo: rockandberg/mediavote-site      # dépôt du site — à remplacer par celui de Mediavote le moment venu
  branch: main
  base_url: https://REMPLACER-PAR-LE-WORKER-OAUTH.workers.dev   # serveur de connexion GitHub (voir docs/CMS.md §3)
  commit_messages:
    create: "Article : {{slug}}"
    update: "Article mis à jour : {{slug}}"
    delete: "Article supprimé : {{slug}}"
    uploadMedia: "Image ajoutée : {{path}}"
    deleteMedia: "Image supprimée : {{path}}"

# Édition en local, sans GitHub : lancer `npm run cms`, puis ouvrir http://localhost:4400/admin/
local_backend: true

# Brouillon → relecture → publication. Rien n'est en ligne sans passer par « Publier ».
publish_mode: editorial_workflow

locale: fr
site_url: https://www.media-vote.com
display_url: https://www.media-vote.com
logo_url: /assets/img/logo-media-vote-blanc.png

media_folder: public/assets/img/actualites
public_folder: /assets/img/actualites

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: actualites
    label: Actualités
    label_singular: Article
    description: "Les articles de la rubrique Actualités. Enregistrer crée un brouillon ; « Publier » met l'article en ligne après reconstruction du site (une à deux minutes)."
    folder: content/actualites
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "actualites/{{slug}}/"
    sortable_fields: [date, title, category]
    summary: "{{title}} — {{category}} — {{date}}"
    editor:
      preview: true
    fields:
      - { label: Titre, name: title, widget: string, hint: "60 caractères au plus pour un affichage complet dans Google." }
      - { label: Date de publication, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: false }
      - { label: Catégorie, name: category, widget: select, options: [Réglementation, Guide pratique, Analyse, Actualité Mediavote, Retour d'expérience], default: Actualité }
      - { label: Chapô, name: description, widget: text, hint: "Deux phrases au plus (140 à 158 caractères). C'est aussi la description affichée par les moteurs de recherche.", pattern: ["^.{60,170}$", "Entre 60 et 170 caractères"] }
      - { label: Image d'illustration, name: image, widget: image, required: false, hint: "Facultative. 1 600 px de large au plus, format JPEG ou WebP." }
      - { label: Description de l'image, name: image_alt, widget: string, required: false, hint: "Obligatoire si une image est ajoutée : décrit ce que montre l'image, pour l'accessibilité et le référencement." }
      - { label: Brouillon, name: draft, widget: boolean, default: false, hint: "Coché : l'article reste invisible sur le site public, même après publication." }
      - { label: Corps de l'article, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list], editor_components: [image], hint: "Titres de niveau 2 et 3, listes, liens, citations, images. Pas de « certifié CNIL », pas de « 100 % sécurisé » : la publication serait refusée." }
